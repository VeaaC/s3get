[package]
name = "s3get"
version = "0.5.0"
edition = "2021"
rust-version = "1.91.1"
license = "MIT"
keywords = ["aws", "s3"]
description = "Download a single file from S3 using chunks"
homepage = "https://github.com/VeaaC/s3get"
repository = "https://github.com/VeaaC/s3get"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.137.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "sync"] }
http = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
